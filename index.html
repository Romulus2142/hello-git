<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>flow creative</title>
    <link rel="stylesheet" href="styles/main.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Albert+Sans:ital,wght@0,100..900;1,100..900&family=Boldonse&family=Ubuntu+Sans:ital,wght@0,100..800;1,100..800&display=swap"
        rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

        href="https://fonts.googleapis.com/css2?family=Noto+Serif+Display:ital,wght@0,100..900;1,100..900&family=Source+Serif+4:ital,opsz,wght@0,8..60,200..900;1,8..60,200..900&display=swap"
        rel="stylesheet">
    <style>
        body,
        html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        .video-background {
            position: fixed;
            right: 0;
            bottom: -50;
            min-width: 100%;
            min-height: 100%;
            width: auto;
            height: auto;
            z-index: -100;
        }




        .banner-slide {
            position: fixed;
            bottom: 10%;
            left: 0;
            width: 100%;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 20px;
            text-align: center;
            font-size: 24px;
            white-space: nowrap;
            animation: slideLeft 15s linear infinite;
            z-index: 50;
        }
    </style>
</head>

<body>

    <!-- AÑADE LOS ATRIBUTOS autoplay Y muted -->
    <video class="video-background" autoplay loop muted playsinline>
        <source src="video/bg_vid.mp4" type="video/mp4">
        Tu navegador no soporta el video.
    </video>
    <div class="bg-color"></div>
    <!-- Botón en esquina superior derecha -->
    <button class="top-right-btn" aria-label="Contacto">+ MENU</button>
    <!-- Resto del contenido -->
    <div class="principal-text">
        <span id="flow-text"><span class="yellow-text">f</span>low <span class="yellow-text">c</span>reative</span>
        <div class="subtitle-text">Soy <span class="yellow-text">Julio Guadarrama</span>, diseñador digital creativo
            especializado en fusionar la estética <br>visual con un desarrollo web funcional.</div>
    </div>

    <!-- GreenSock CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script type="text/javascript" src="js/main.js"></script>


</body>

</html>
